server:
  port: 8080

spring:
  application:
    name: cloud-vendor-api
  
  datasource:
    url: jdbc:mysql://localhost:3306/cloudvendor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: MySQLhandson#2023
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  sql:
    init:
      mode: always

logging:
  level:
    com.example.cloudvendor: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true