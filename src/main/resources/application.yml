server:
  port: 9090
  #port: 8080

spring:
  application:
    name: cloud-vendor-api
  
  datasource:
#    url: jdbc:mysql://localhost:3306/vendor_mgmt_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
#    username: root
#    password: MySQLhandson#2023
    url: jdbc:mysql://${DB_HOST}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    #url: jdbc:mysql://localhost:3306/cloudvendor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  sql:
    init:
      mode: always

logging:
  config: classpath:logback-spring.xml
  file:
    name: logs/cloud-vendor-api.log
  level:
    com.example.cloudvendor: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    root: INFO

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: true